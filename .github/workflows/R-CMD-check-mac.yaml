on:
  push:
    branches:
      - devel

name: R-CMD-check-mac

permissions:
  contents: write


jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    env:
      RSPDE_COMPILE: "1"    

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})    

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macOS-latest, r: 'release'}

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true
          extra-repositories: 'https://inla.r-inla-download.org/R/testing'

      - name: Install system dependencies on macOS
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          brew install --cask xquartz
          brew install pkg-config
          brew install proj@9
          brew install gdal
          brew install eigen
          brew install gcc@14
          sudo mkdir -p /usr/local/include
          sudo mkdir -p /usr/local/bin
          sudo ln -sf $(brew --prefix gcc@14)/bin/gcc-14 /usr/local/bin/gcc
          sudo ln -sf $(brew --prefix gcc@14)/bin/g++-14 /usr/local/bin/g++
          sudo ln -sf $(brew --prefix gcc@14)/bin/gfortran-14 /usr/local/bin/gfortran
          sudo ln -sfn $(brew --prefix eigen)/include/eigen3 /usr/local/include/eigen3
          sudo ln -sfn $(brew --prefix)/lib /usr/local/brewlib
          sudo ln -sfn $(brew --prefix)/include /usr/local/brewinclude

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"all"'
          extra-packages: |
             rcmdcheck
      - name: Session info
        run: |
          options(width = 100)
          pkgs <- installed.packages()[, "Package"]
          sessioninfo::session_info(pkgs, include_base = TRUE)
        shell: Rscript {0}         
      - uses: r-lib/actions/check-r-package@v2
        env:
          _R_CHECK_CRAN_INCOMING_REMOTE_: false
        with:
          args: 'c("--no-manual", "--as-cran", "--configure-args=--enable-compiled")'
          error-on: '"error"'
