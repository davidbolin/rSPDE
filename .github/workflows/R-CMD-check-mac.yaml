on:
  push:
    branches:
      - devel-src
  pull_request:
    branches:
      - devel
      - devel-src

name: R-CMD-check-mac

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macOS-latest, r: 'release'}

    env:
      R_REMOTES_NO_ERRORS_FROM_WARNINGS: true
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true
          extra-repositories: "https://inla.r-inla-download.org/R/testing https://mugglejinx.github.io/drat/"

      - name: Install system dependencies on macOS
        if: runner.os == 'macOS'
        run: |
          brew install --cask xquartz
          brew install pkg-config
          brew install proj@9
          brew install gdal
          brew install gcc
          brew install eigen
          brew install gcc@14
          brew install mimalloc
          sudo mkdir -p /usr/local/include
          sudo mkdir -p /usr/local/bin
          sudo ln -s $(brew --prefix gcc@14)/bin/gcc-14 /usr/local/bin/gcc
          sudo ln -s $(brew --prefix gcc@14)/bin/g++-14 /usr/local/bin/g++
          sudo ln -s $(brew --prefix eigen)/include/eigen3 /usr/local/include/eigen3
          echo "export DYLD_LIBRARY_PATH=$(brew --prefix mimalloc)/lib:$DYLD_LIBRARY_PATH" >> $GITHUB_ENV

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"all"'
          extra-packages: |
             rcmdcheck

      - name: Session info
        run: |
          options(width = 100)
          pkgs <- installed.packages()[, "Package"]
          sessioninfo::session_info(pkgs, include_base = TRUE)
        shell: Rscript {0}

      - uses: r-lib/actions/check-r-package@v2
        env:
          _R_CHECK_CRAN_INCOMING_REMOTE_: false
        with:
          args: 'c("--no-manual", "--as-cran")'
          error-on: '"error"'

  retry-on-failure:
    needs: R-CMD-check
    if: ${{ failure() && github.run_attempt < 3 }}
    runs-on: ${{ matrix.config.os }}
    name: Retry ${{ matrix.config.os }} (${{ matrix.config.r }}) - Attempt ${{ github.run_attempt }}

    strategy:
      matrix:
        config:
          - {os: macOS-latest, r: 'release'}

    env:
      R_REMOTES_NO_ERRORS_FROM_WARNINGS: true
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      - name: Install system dependencies on macOS
        if: runner.os == 'macOS'
        run: |
          brew install --cask xquartz
          brew install pkg-config
          brew install proj@9
          brew install gdal
          brew install gcc
          brew install eigen
          brew install gcc@14
          brew install mimalloc
          sudo mkdir -p /usr/local/include
          sudo mkdir -p /usr/local/bin
          sudo ln -s $(brew --prefix gcc@14)/bin/gcc-14 /usr/local/bin/gcc
          sudo ln -s $(brew --prefix gcc@14)/bin/g++-14 /usr/local/bin/g++
          sudo ln -s $(brew --prefix eigen)/include/eigen3 /usr/local/include/eigen3
          echo "export DYLD_LIBRARY_PATH=$(brew --prefix mimalloc)/lib:$DYLD_LIBRARY_PATH" >> $GITHUB_ENV

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"all"'
          extra-packages: |
             rcmdcheck

      - uses: r-lib/actions/check-r-package@v2
        env:
          _R_CHECK_CRAN_INCOMING_REMOTE_: false
        with:
          args: 'c("--no-manual", "--as-cran")'
          error-on: '"error"'
