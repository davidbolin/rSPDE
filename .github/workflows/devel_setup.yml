name: devel_setup

permissions:
  contents: write


on:
  push:
    branches:
      - devel

jobs:
  devel_setup:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.RSPDE }}
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup and Push
        shell: bash
        run: |
          set -euo pipefail
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            echo "Event is push; pushing updates"
            if [ -z "${GITHUB_PAT:-}" ]; then
              echo "GITHUB_PAT is empty; cannot push"
              exit 1
            fi
            git remote set-url origin https://x-access-token:${GITHUB_PAT}@github.com/${{ github.repository }}.git
          fi

          git fetch origin devel devel-src
          git checkout devel-src

          git reset --hard origin/devel
          if git ls-tree -d --name-only origin/devel-src src | grep -q '^src$'; then
            git checkout origin/devel-src -- src/
          fi
          git add -A

          if [ -f DESCRIPTION ]; then
            sed -i 's/NeedsCompilation: no/NeedsCompilation: yes/' DESCRIPTION
            git add DESCRIPTION
          fi
          
          if ! git diff-index --quiet HEAD --; then
            git commit -m "Doing the setup"
            if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
              echo "Event is push; pushing updates"
              if ! git push origin devel-src; then
                git push origin devel-src --force-with-lease
              fi
            fi
          fi
