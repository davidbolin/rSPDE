name: devel_setup

on:
  push:
    branches:
      - devel

jobs:
  devel_setup:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup and Push
        shell: bash
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git

          git fetch origin devel-src
          git checkout devel-src
          
          git merge origin/devel -X theirs --no-edit --no-commit --no-ff --allow-unrelated-histories
          
          git checkout --theirs .
          git add . 
          git reset -- src/
          
          if [ -f DESCRIPTION ]; then
            sed -i 's/NeedsCompilation: no/NeedsCompilation: yes/' DESCRIPTION
            git add DESCRIPTION
          fi
          
          if ! git diff-index --quiet HEAD --; then
            git commit -m "Doing the setup"
            git push origin devel-src --force
          fi
