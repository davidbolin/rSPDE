on:
  push:
    branches:
      - cran

name: cran_setup

permissions:
  contents: write

jobs:
  cran_setup:
    runs-on: macOS-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          extra-repositories: "https://inla.r-inla-download.org/R/testing"

      - uses: r-lib/actions/setup-pandoc@v2

      - name: Query dependencies
        run: |
          install.packages('remotes')
          saveRDS(remotes::dev_package_deps(dependencies = TRUE), ".github/depends.Rds", version = 2)
          writeLines(sprintf("R-%i.%i", getRversion()$major, getRversion()$minor), ".github/R-version")
        shell: Rscript {0}

      - name: Install system dependencies
        run: |
          brew install --cask xquartz
          brew install pkg-config
          brew install proj@9
          brew install gdal

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"all"'
          extra-packages: |
             pkgdown
             rmarkdown
             devtools

      - name: Session info
        run: |
          options(width = 100)
          pkgs <- installed.packages()[, "Package"]
          sessioninfo::session_info(pkgs, include_base = TRUE)
        shell: Rscript {0}

      - name: Prepare the pure-R CRAN source
        run: |
          set -euo pipefail
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"

          # Compilation is deliberately unavailable on the CRAN branch. INLA
          # provides the Cgeneric models, and rspde_safe_inla() protects tests
          # and examples when a required INLA model is temporarily unavailable.
          git rm -rf --ignore-unmatch \
            configure configure.win cleanup cleanup.win \
            src inst/src-optional inst/shared
          rm -rf \
            configure configure.win cleanup cleanup.win \
            src inst/src-optional inst/shared

          # These legacy workflows only support compiled source branches and
          # are not part of the pure-R CRAN branch.
          git rm -f --ignore-unmatch \
            .github/workflows/R-CMD-check.yaml \
            .github/workflows/R-CMD-check-mac.yaml \
            .github/workflows/R-CMD-check-windows.yaml \
            .github/workflows/devel_setup.yml \
            .github/workflows/devel_src_setup.yml \
            .github/workflows/stable_setup.yml \
            .github/workflows/stable_src_setup.yml \
            .github/workflows/pkgdown.yaml

          # Keep a directly merged CRAN vignette when no cran_vignettes
          # directory is present. If cran_vignettes contains the canonical
          # file, replace only that file and preserve the vignettes directory.
          if [ -f cran_vignettes/rSPDE_package.Rmd ]; then
            mkdir -p vignettes
            cp cran_vignettes/rSPDE_package.Rmd vignettes/rSPDE_package.Rmd
          fi

          if [ -d cran_vignettes ]; then
            git rm -rf --ignore-unmatch cran_vignettes
            rm -rf cran_vignettes
          fi

          # A CRAN package without the canonical vignette should not retain a
          # stale or incomplete vignettes directory. A missing cran_vignettes
          # directory is intentionally harmless.
          if [ ! -f vignettes/rSPDE_package.Rmd ]; then
            git rm -rf --ignore-unmatch vignettes
            rm -rf vignettes
          else
            # The CRAN source must contain exactly the canonical vignette;
            # remove any extra files or subdirectories left by a merge.
            find vignettes -mindepth 1 -maxdepth 1 \
              ! -name rSPDE_package.Rmd -exec rm -rf {} +
          fi

          if [ -d man/figures ]; then
            git rm -rf man/figures
            rm -rf man/figures
          fi

          if [ -d vignettes ]; then
            git add vignettes
          fi

          Rscript -e "devtools::document()"
          R CMD INSTALL .

          git add man
          git add NAMESPACE
          git add .Rbuildignore
          git add DESCRIPTION

          if ! git diff-index --quiet HEAD --; then
            git commit -m "Doing the setup"
            git fetch origin cran
            git rebase origin/cran || git rebase --abort
            git push origin cran || git push origin cran --force-with-lease
          fi
        shell: bash
