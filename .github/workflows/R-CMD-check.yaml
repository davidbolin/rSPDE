# For help debugging build failures open an issue on the RStudio community with the 'github-actions' tag.
# https://community.rstudio.com/new-topic?category=Package%20development&tags=github-actions

on:
  push:
    branches:
      - devel

name: R-CMD-check

permissions:
  contents: write
  actions: write

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest, r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest, r: 'release'}

    env:
      R_REMOTES_NO_ERRORS_FROM_WARNINGS: true
      R_KEEP_PKG_SOURCE: yes
      RSPDE_COMPILE: "1"

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true
          extra-repositories: 'https://inla.r-inla-download.org/R/testing'

      - name: Install system dependencies on Linux
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y \
            libglu1-mesa-dev \
            libeigen3-dev \
            build-essential \
            gfortran
          sudo ln -sf /usr/bin/gcc /usr/local/bin/gcc
          sudo ln -sf /usr/bin/g++ /usr/local/bin/g++
          sudo ln -sf /usr/bin/gfortran /usr/local/bin/gfortran

      - name: Configure Linux compilers
        if: runner.os == 'Linux'
        run: |
          mkdir -p ~/.R
          {
            echo "CC=gcc"
            echo "CXX=g++"
            echo "CXX11=g++"
            echo "CXX14=g++"
            echo "CXX17=g++"
            echo "FC=gfortran"
            echo "F77=gfortran"
          } >> ~/.R/Makevars

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"all"'
          extra-packages: |
            rcmdcheck
            INLA

      - name: Session info
        run: |
          options(width = 100)
          pkgs <- installed.packages()[, "Package"]
          sessioninfo::session_info(pkgs, include_base = TRUE)
        shell: Rscript {0}

      - uses: r-lib/actions/check-r-package@v2
        env:
          _R_CHECK_CRAN_INCOMING_REMOTE_: false
        with:
          args: 'c("--no-manual", "--as-cran", "--install-args=--configure-args=--enable-compiled")'
          error-on: '"error"'

  retry-on-failure:
    if: failure() && fromJSON(github.run_attempt) < 3
    needs: [R-CMD-check]
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run retry-workflow.yml -F run_id=${{ github.run_id }}