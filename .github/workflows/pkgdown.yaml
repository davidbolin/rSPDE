on:
  push:
    branches:
      - devel-src

name: pkgdown

permissions:
  contents: write


jobs:
  pkgdown:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      FLEXIBLAS_LIBRARY_PATH: /usr/lib/x86_64-linux-gnu/flexiblas:/opt/intel/oneapi/mkl/latest/lib/intel64
    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          extra-repositories: 'https://inla.r-inla-download.org/R/testing https://davidbolin.github.io/ngme2/'

      - name: Install system dependencies on Linux (GL)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y gpg-agent ca-certificates software-properties-common
          sudo add-apt-repository -y universe
          # Intel oneAPI MKL repo
          curl -fsSL https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB \
            | sudo gpg --dearmor -o /usr/share/keyrings/intel-oneapi-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/intel-oneapi-archive-keyring.gpg] https://apt.repos.intel.com/oneapi all main" \
            | sudo tee /etc/apt/sources.list.d/oneapi.list
          sudo apt-get update -y
          sudo apt-get install -y \
            libglu1-mesa-dev \
            libeigen3-dev \
            libflexiblas3 \
            libflexiblas-dev \
            libflexiblas-netlib \
            libopenblas0-pthread \
            libblas3 \
            liblapack3 \
            intel-oneapi-mkl
          sudo update-alternatives --set libblas.so.3-x86_64-linux-gnu /usr/lib/x86_64-linux-gnu/flexiblas/libflexiblas.so.3
          sudo update-alternatives --set liblapack.so.3-x86_64-linux-gnu /usr/lib/x86_64-linux-gnu/flexiblas/libflexiblas.so.3
          sudo ln -s /usr/bin/gcc /usr/local/bin/gcc
          sudo ln -s /usr/bin/g++ /usr/local/bin/g++          

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"all"'
          extra-packages: |
             pkgdown
      - name: Session info
        run: |
          options(width = 100)
          pkgs <- installed.packages()[, "Package"]
          sessioninfo::session_info(pkgs, include_base = TRUE)
        shell: Rscript {0}

      - name: Verify FlexiBLAS backends
        run: |
          options(width = 100)
          if (!requireNamespace("flexiblas", quietly = TRUE)) {
            stop("flexiblas R package not installed; cannot verify backends")
          }
          backends <- flexiblas::flexiblas_list()
          message("FlexiBLAS backends: ", paste(backends, collapse = ", "))
          if (!any(grepl("netlib", tolower(backends)))) {
            stop("Netlib backend not found in FlexiBLAS list")
          }
          if (!any(grepl("mkl", tolower(backends)))) {
            stop("MKL backend not found in FlexiBLAS list")
          }
        shell: Rscript {0}

      - name: Install package
        run: R CMD INSTALL .

      - name: Deploy package
        run: |
          set -euo pipefail
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          Rscript -e 'library(rmarkdown); rmarkdown::render("index.Rmd", "md_document")'     
          cp index_files/figure-markdown_mmd/* man/figures/
          sed -i 's/index_files/man/' index.md
          sed -i 's/figure-markdown_mmd/figures/' index.md
          git add *
          git commit -m "adding index.md and figures"
          Rscript -e 'pkgdown::deploy_to_branch(new_process = FALSE)'
