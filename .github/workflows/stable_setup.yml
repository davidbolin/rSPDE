on:
  push:
    branches:
      - stable

name: stable_inla_src_setup

permissions:
  contents: write

concurrency:
  group: inla-source-sync
  cancel-in-progress: false

jobs:
  inla_src_setup:
    runs-on: ubuntu-latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: stable

      - name: Copy INLA source files from stable to inla
        shell: bash
        run: |
          set -euo pipefail

          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"

          if [ -z "${GITHUB_PAT:-}" ]; then
            echo "GITHUB_PAT is empty; cannot update the inla branch"
            exit 1
          fi
          git remote set-url origin https://x-access-token:${GITHUB_PAT}@github.com/${{ github.repository }}.git

          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          shopt -s nullglob

          files=(
            inst/src-optional/*.c
            inst/src-optional/*.cpp
            inst/src-optional/cgeneric_cpp.h
            inst/src-optional/cgeneric_defs.h
          )

          if [ ${#files[@]} -eq 0 ]; then
            echo "No INLA source files found on stable."
            exit 1
          fi
          cp "${files[@]}" "$tmpdir/"

          git fetch origin inla
          git checkout -B inla origin/inla

          mkdir -p src
          find src -maxdepth 1 -type f \
            \( -name '*.c' -o -name '*.cpp' -o \
               -name 'cgeneric_cpp.h' -o -name 'cgeneric_defs.h' \) \
            -delete
          cp "$tmpdir"/* src/
          git add -A src

          if git diff --cached --quiet; then
            echo "The inla branch is already up to date."
            exit 0
          fi

          git commit -m "Update INLA source files from stable"
          git push origin inla
