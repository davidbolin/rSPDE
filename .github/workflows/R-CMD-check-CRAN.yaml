on:
  push:
    branches:
      - cran
  
name: R-CMD-check-CRAN

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest, r: 'release'}
          - {os: macOS-latest, r: 'release'}
          - {os: windows-latest, r: 'release'}

    env:
      R_REMOTES_NO_ERRORS_FROM_WARNINGS: true
      R_KEEP_PKG_SOURCE: yes
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true
          extra-repositories: |
            https://inla.r-inla-download.org/R/testing

      - name: Install system dependencies on macOS
        if: runner.os == 'macOS'
        run: |
          brew install --cask xquartz
          brew install pkg-config
          brew install proj@9
          brew install gdal

      - name: Install LaTeX on Ubuntu
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y texlive-latex-base texlive-fonts-recommended texlive-fonts-extra texlive-latex-extra

      - name: Install LaTeX on Windows
        if: runner.os == 'Windows'
        run: |
          choco install miktex --params "/Paper=a4" --yes
          refreshenv
          "C:\Program Files\MiKTeX\miktex\bin\x64\initexmf.exe" --update-fndb --admin
          "C:\Program Files\MiKTeX\miktex\bin\x64\initexmf.exe" --mkmaps --admin

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"all"'

      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--as-cran", "--run-donttest", "--timings", "--incoming", "--remote")'
          error-on: 'error'
