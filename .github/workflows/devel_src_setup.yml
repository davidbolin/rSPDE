on:
  push:
    branches:
      - devel

name: inla_src_setup

permissions:
  contents: write

jobs:
  inla_src_setup:
    if: github.actor != 'github-actions[bot]' && endsWith(github.event.head_commit.message, 'INLA UPDATE')
    runs-on: ubuntu-latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: devel

      - name: Copy INLA source files from devel to inla
        run: |
          set -euo pipefail

          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"

          git remote set-url origin https://x-access-token:${GITHUB_PAT}@github.com/${{ github.repository }}.git

          tmpdir="$(mktemp -d)"
          shopt -s nullglob

          files=(
            inst/src-optional/*.c
            inst/src-optional/*.cpp
            inst/src-optional/cgeneric_cpp.h
            inst/src-optional/cgeneric_defs.h
          )

          if [ ${#files[@]} -eq 0 ]; then
            echo "No files found to copy."
            exit 0
          fi

          cp "${files[@]}" "$tmpdir/"

          git fetch origin inla
          git checkout -B inla origin/inla

          mkdir -p src
          cp "$tmpdir"/* src/

          git add src

          if ! git diff --cached --quiet; then
            git commit -m "Copy INLA source files from devel"
            git push origin inla
          else
            echo "No changes to commit."
          fi
        shell: bash