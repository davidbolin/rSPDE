on:
  push:
    branches:
      - devel-src

name: devel_src_setup

permissions:
  contents: write

  
jobs:
    devel_src_setup:
      runs-on: ubuntu-latest
      env:
        GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      steps:
        - uses: actions/checkout@v4      
        
        - name: Merge with devel, remove src and accept all incoming changes
          run: |
            set -euo pipefail
            git config --local user.email "actions@github.com"
            git config --local user.name "GitHub Actions"
            git fetch origin devel-src
            git checkout devel
            git reset --hard origin/devel-src

            if [ -f DESCRIPTION ]; then
              sed -i 's/NeedsCompilation: yes/NeedsCompilation: no/' DESCRIPTION
              git add DESCRIPTION
            fi

            git rm -rf --ignore-unmatch src
            rm -rf src
            git add -A

            if ! git diff-index --quiet HEAD --; then
              git commit -m "Doing the setup"
              if ! git push origin devel; then
                git push origin devel --force-with-lease
              fi
            fi
          shell: bash
